name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-19

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config

      - name: npm install
        run: npm install

      - name: Download prebuilt WebRTC
        run: ./scripts/download-prebuilt-webrtc.sh build-${{ matrix.platform }}

      - name: Configure
        run: npx cmake-js configure -O build-${{ matrix.platform }} --CDSKIP_WEBRTC_BUILD=ON
        env:
          CC: ${{ runner.os == 'Linux' && 'clang-19' || '' }}
          CXX: ${{ runner.os == 'Linux' && 'clang++-19' || '' }}

      - name: Build node addon
        run: npx cmake-js build -O build-${{ matrix.platform }}
        env:
          CC: ${{ runner.os == 'Linux' && 'clang-19' || '' }}
          CXX: ${{ runner.os == 'Linux' && 'clang++-19' || '' }}

      - name: Package prebuilt
        run: |
          mkdir -p prebuilds/${{ matrix.platform }}
          cp build-${{ matrix.platform }}/Release/wrtc.node prebuilds/${{ matrix.platform }}/wrtc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-${{ matrix.platform }}
          path: prebuilds/${{ matrix.platform }}/wrtc.node

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          for dir in artifacts/wrtc-*/; do
            platform=$(basename "$dir" | sed 's/wrtc-//')
            cp "$dir/wrtc.node" "wrtc-${platform}.node"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: wrtc-*.node
